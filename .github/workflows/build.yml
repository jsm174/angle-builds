name: Build ANGLE

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-15 }
          - { platform: windows-x64, os: windows-2025 }
    steps:
      - uses: actions/checkout@v7

      - name: Stage and build
        run: platforms/${{ matrix.platform }}/external.sh

      - name: Package
        run: |
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            cd dist/${{ matrix.platform }} && 7z a -r ../../angle-${{ matrix.platform }}.zip .
          else
            tar czf angle-${{ matrix.platform }}.tar.gz -C dist/${{ matrix.platform }} .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: angle-${{ matrix.platform }}
          path: angle-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./platforms/config.sh
          TAG="v$(date -u +%Y%m%d)-${ANGLE_SHA:0:12}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "ANGLE libEGL/libGLESv2 built from https://chromium.googlesource.com/angle/angle at commit ${ANGLE_SHA}" \
            angle-*.zip angle-*.tar.gz
